[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "baquant-pit"
version = "0.1.0"
description = "Temporal, canonicalization and raw-integrity primitives for point-in-time research."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Sikisiii/baquant-pit"
Repository = "https://github.com/Sikisiii/baquant-pit"
Documentation = "https://github.com/Sikisiii/baquant-pit#readme"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
