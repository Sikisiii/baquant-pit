name: Cross-platform conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    name: conformance (${{ matrix.os }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Runtime and frozen golden conformance
        run: python -m pytest -ra --basetemp="${{ runner.temp }}/pitx" --junitxml="${{ runner.temp }}/pitx-results.xml"
      - name: Record platform outcomes and explicit skips
        if: always()
        run: python tools/summarize_cross_platform.py "${{ runner.temp }}/pitx-results.xml"
